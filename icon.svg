<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#2563EB"/>

  <!-- Calendar top bar -->
  <rect x="80" y="100" width="352" height="60" rx="12" fill="#1E40AF"/>

  <!-- Calendar body -->
  <rect x="80" y="140" width="352" height="272" rx="12" fill="white"/>

  <!-- Week row highlight -->
  <rect x="96" y="240" width="320" height="44" rx="8" fill="#DBEAFE"/>

  <!-- Calendar grid lines (vertical) -->
  <line x1="128" y1="180" x2="128" y2="396" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="176" y1="180" x2="176" y2="396" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="224" y1="180" x2="224" y2="396" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="272" y1="180" x2="272" y2="396" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="320" y1="180" x2="320" y2="396" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="368" y1="180" x2="368" y2="396" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Calendar grid lines (horizontal) -->
  <line x1="96" y1="196" x2="416" y2="196" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="96" y1="240" x2="416" y2="240" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="96" y1="284" x2="416" y2="284" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="96" y1="328" x2="416" y2="328" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="96" y1="372" x2="416" y2="372" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Week number badge -->
  <circle cx="256" cy="268" r="90" fill="#2563EB"/>
  <circle cx="256" cy="268" r="84" fill="white"/>

  <!-- Week number text -->
  <text x="256" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#9CA3AF" text-anchor="middle">WEEK</text>
  <text x="256" y="305" font-family="Arial, sans-serif" font-size="88" font-weight="800" fill="#2563EB" text-anchor="middle">42</text>

  <!-- Calendar binding holes -->
  <circle cx="140" cy="130" r="8" fill="#93C5FD"/>
  <circle cx="200" cy="130" r="8" fill="#93C5FD"/>
  <circle cx="312" cy="130" r="8" fill="#93C5FD"/>
  <circle cx="372" cy="130" r="8" fill="#93C5FD"/>
</svg>
